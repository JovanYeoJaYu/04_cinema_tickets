name: Run pytest

on: 
  workflow_dispatch:

  push:
    branches: [ main, development ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/Pytest.yml"
  
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/Pytest.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: python -m pytest
